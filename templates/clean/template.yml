id: clean
name: Clean
description: Trình bày tối giản, không đánh số heading.
number_sections: false
toc_depth: 2
filters:
  - ../default/admonitions.lua
formats:
  html:
    to: html5
    extension: html
    template: ../default/html-template.html
    stylesheet: ../default/book.css
    embed_resources: true
  pdf:
    to: latex
    extension: pdf
    template: ../default/pdf-template.tex
    pdf_engine: xelatex
