id: editorial-banner
name: Editorial Banner
description: Banner xanh đậm, dải màu trang và content cards giàu tương phản.
inspired_by:
  - https://www.vniteach.com/2023/08/20/latex-templates-mau-bia-va-noi-dung-tuyet-dep/
number_sections: false
toc_depth: 2
filters:
  - ../editorial/editorial.lua
  - ../default/admonitions.lua
  - ../chapter-lesson/chapter-lesson.lua
formats:
  html:
    to: html5
    extension: html
    template: ../default/html-template.html
    stylesheet:
      - ../default/book.css
      - banner.css
    embed_resources: true
  pdf:
    to: latex
    extension: pdf
    template: ../default/pdf-template.tex
    header_includes:
      - banner.tex
    pdf_engine: xelatex
