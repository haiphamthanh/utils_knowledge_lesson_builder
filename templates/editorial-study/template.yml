id: editorial-study
name: Editorial Study
description: PDF A4 cyan–orange, chapter C–HƯƠNG và khung bài học kiểu giáo trình.
inspired_by:
  - https://www.vniteach.com/2022/08/03/latex-templates-noi-dung-sach-tuyet-dep-1/
number_sections: false
toc_depth: 2
filters:
  - ../editorial/editorial.lua
  - ../default/admonitions.lua
  - ../editorial/ornate-numbering.lua
formats:
  html:
    to: html5
    extension: html
    template: ../default/html-template.html
    stylesheet:
      - ../default/book.css
      - study.css
    embed_resources: true
  pdf:
    to: latex
    extension: pdf
    template: pdf-template.tex
    pdf_engine: xelatex
