<!doctype html>
<html lang="$lang$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description$">
  <title>$title$</title>
$for(css)$
  <link rel="stylesheet" href="$css$">
$endfor$
$if(highlighting-css)$
  <style>$highlighting-css$</style>
$endif$
</head>
<body>
  <header class="book-cover">
    <p class="eyebrow">KNOWLEDGE COOKBOOK</p>
    <h1>$title$</h1>
$if(subtitle)$
    <p class="subtitle">$subtitle$</p>
$endif$
$if(path-title)$
    <p class="edition">$path-title$$if(date)$ · $date$$endif$</p>
$endif$
  </header>
  <div class="book-layout">
$if(toc)$
    <nav id="$idprefix$TOC" class="toc" aria-label="Mục lục">
      <h2>Mục lục</h2>
      $table-of-contents$
    </nav>
$endif$
    <main class="book-content">
$body$
    </main>
  </div>
  <footer class="book-footer">$title$</footer>
</body>
</html>
