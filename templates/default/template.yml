id: default
name: Default Academic
description: Template tương thích cũ với đánh số phân cấp đầy đủ.
number_sections: true
toc_depth: 2
filters:
  - admonitions.lua
formats:
  html:
    to: html5
    extension: html
    template: html-template.html
    stylesheet: book.css
    embed_resources: true
  pdf:
    to: latex
    extension: pdf
    template: pdf-template.tex
    pdf_engine: xelatex
